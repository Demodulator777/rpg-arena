<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - RPG Arena</title>
<link rel="stylesheet" href="/css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0a0a0f; color:#e0dcd0; min-height:100vh; }
a { color:#c8a86e; text-decoration:none; }
a:hover { color:#e8c88e; }
h1 { text-align:center; padding:24px; font-size:28px; color:#f0e8d0; border-bottom:1px solid #2a2a35; margin-bottom:24px; }
h2 { font-size:18px; margin-bottom:12px; color:#d4c8a0; border-left:3px solid #c8a86e; padding-left:10px; }
.container { max-width:1100px; margin:0 auto; padding:0 16px 40px; }

.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid #2a2a35; padding-bottom:0; }
.tab-btn { padding:10px 20px; background:#14141e; border:1px solid #2a2a35; border-bottom:none; border-radius:8px 8px 0 0; color:#8a8a90; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; }
.tab-btn:hover { color:#e0dcd0; background:#1a1a28; }
.tab-btn.active { background:#0a0a0f; color:#c8a86e; border-color:#c8a86e; }
.tab-content { display:none; }
.tab-content.active { display:block; }

table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #2a2a35; }
th { color:#8a8a90; font-weight:500; text-transform:uppercase; font-size:10px; letter-spacing:.5px; position:sticky; top:0; background:#0a0a0f; z-index:1; }
tr:hover td { background:#1a1a28; }
.table-wrap { overflow-x:auto; max-height:500px; overflow-y:auto; border:1px solid #2a2a35; border-radius:8px; }
.loading { text-align:center; padding:40px; color:#6a6a70; font-size:14px; }
.error { color:#e06060; padding:12px; text-align:center; }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.badge-yes { background:#1a4a1a; color:#60e060; }
.badge-no { background:#4a1a1a; color:#e06060; }
.card-compact { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:16px; margin-bottom:12px; }
.card-compact .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.card-compact .row + .row { margin-top:8px; padding-top:8px; border-top:1px solid #2a2a35; }
.card-compact .lbl { color:#8a8a90; font-size:11px; text-transform:uppercase; letter-spacing:.5px; min-width:80px; }
.card-compact .val { color:#e0dcd0; font-size:13px; word-break:break-word; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
.banner-card { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:14px; }
.banner-card .name { font-size:15px; font-weight:600; color:#f0e8d0; }
.banner-card .meta { font-size:11px; color:#6a6a70; margin:4px 0 8px; }
.banner-card .desc { font-size:12px; color:#b0a890; margin-bottom:8px; }
.banner-card .stat { display:inline-block; margin-right:12px; font-size:11px; color:#8a8a90; }
th.sortable { cursor:pointer; }
th.sortable:hover { color:#c8a86e; }
.count-badge { display:inline-block; background:#2a2a35; color:#c8a86e; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:6px; }
.bug-title { max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.reward-scope { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; text-transform:uppercase; }
.scope-all { background:#1a3a5a; color:#60a0e0; }
.scope-everyone { background:#3a1a5a; color:#b060e0; }
.db-scroll { overflow-x:auto; border:1px solid #444; border-radius:8px; }
.db-scroll table { min-width:600px; }
.db-scroll th, .db-scroll td { white-space:nowrap; }
.db-scroll td .dsp { font-size:12px; line-height:1.4; }
.db-scroll td .ed { white-space:nowrap; }
@media (max-width:640px) {
  .tabs { flex-wrap:wrap; gap:2px; }
  .tab-btn { flex:1 1 auto; font-size:11px; padding:8px 6px; text-align:center; }
  .container { padding:0 6px 20px; }
  h1 { font-size:20px; padding:16px; }
  .table-wrap { max-height:none; font-size:11px; }
  .table-wrap th, .table-wrap td { padding:4px 5px; }
  .card-grid { grid-template-columns:1fr; }
  .db-scroll table { font-size:11px; }
  .db-scroll th, .db-scroll td { padding:3px 4px; }
}
</style>
</head>
<body>
<h1>Admin Panel</h1>
<div class="container" id="app">
  <div class="loading" id="init-loading">Checking access...</div>
</div>
<script src="/admin/panel.js"></script>
</body>
</html>
