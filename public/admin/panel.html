<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - RPG Arena</title>
<link rel="stylesheet" href="/css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0a0a0f; color:#e0dcd0; min-height:100vh; }
a { color:#c8a86e; text-decoration:none; }
a:hover { color:#e8c88e; }
h1 { text-align:center; padding:24px; font-size:28px; color:#f0e8d0; border-bottom:1px solid #2a2a35; margin-bottom:24px; }
h2 { font-size:18px; margin-bottom:12px; color:#d4c8a0; border-left:3px solid #c8a86e; padding-left:10px; }
.container { max-width:1100px; margin:0 auto; padding:0 16px 40px; }

.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid #2a2a35; padding-bottom:0; }
.tab-btn { padding:10px 20px; background:#14141e; border:1px solid #2a2a35; border-bottom:none; border-radius:8px 8px 0 0; color:#8a8a90; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; }
.tab-btn:hover { color:#e0dcd0; background:#1a1a28; }
.tab-btn.active { background:#0a0a0f; color:#c8a86e; border-color:#c8a86e; }
.tab-content { display:none; }
.tab-content.active { display:block; }

table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #2a2a35; }
th { color:#8a8a90; font-weight:500; text-transform:uppercase; font-size:10px; letter-spacing:.5px; position:sticky; top:0; background:#0a0a0f; z-index:1; }
tr:hover td { background:#1a1a28; }
.table-wrap { overflow-x:auto; max-height:500px; overflow-y:auto; border:1px solid #2a2a35; border-radius:8px; }
.loading { text-align:center; padding:40px; color:#6a6a70; font-size:14px; }
.error { color:#e06060; padding:12px; text-align:center; }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.badge-yes { background:#1a4a1a; color:#60e060; }
.badge-no { background:#4a1a1a; color:#e06060; }
.card-compact { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:16px; margin-bottom:12px; }
.card-compact .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.card-compact .row + .row { margin-top:8px; padding-top:8px; border-top:1px solid #2a2a35; }
.card-compact .lbl { color:#8a8a90; font-size:11px; text-transform:uppercase; letter-spacing:.5px; min-width:80px; }
.card-compact .val { color:#e0dcd0; font-size:13px; word-break:break-word; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
.banner-card { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:14px; }
.banner-card .name { font-size:15px; font-weight:600; color:#f0e8d0; }
.banner-card .meta { font-size:11px; color:#6a6a70; margin:4px 0 8px; }
.banner-card .desc { font-size:12px; color:#b0a890; margin-bottom:8px; }
.banner-card .stat { display:inline-block; margin-right:12px; font-size:11px; color:#8a8a90; }
th.sortable { cursor:pointer; }
th.sortable:hover { color:#c8a86e; }
.count-badge { display:inline-block; background:#2a2a35; color:#c8a86e; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:6px; }
.bug-title { max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.reward-scope { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; text-transform:uppercase; }
.scope-all { background:#1a3a5a; color:#60a0e0; }
.scope-everyone { background:#3a1a5a; color:#b060e0; }
</style>
</head>
<body>
<h1>Admin Panel</h1>
<div class="container" id="app">
  <div class="loading" id="init-loading">Checking access...</div>
</div>
<script>
const API = path => {
    const token = localStorage.getItem('rpg_token');
    return fetch('/api/game' + path, { headers: { 'Authorization': 'Bearer ' + token } }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    });
};

async function init() {
    const token = localStorage.getItem('rpg_token');
    if (!token) { renderNoAccess('Not logged in.'); return; }
    try {
        const check = await API('/admin/check');
        if (!check.isAdmin) { renderNoAccess('Admin access required.'); return; }
    } catch(e) { renderNoAccess('Failed to verify access: ' + e.message); return; }
    renderLayout();
}

function renderNoAccess(msg) {
    document.getElementById('app').innerHTML = '<h2 style="color:#e06060;text-align:center;margin-top:60px">Access Denied</h2><p style="text-align:center;color:#8a8a90;margin-top:8px">' + msg + '</p>';
}

function renderLayout() {
    document.getElementById('app').innerHTML = `
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="csp">CSP Violations</button>
        <button class="tab-btn" data-tab="bugs">Bug Reports</button>
        <button class="tab-btn" data-tab="banners">Banners</button>
        <button class="tab-btn" data-tab="rewards">Rewards</button>
    </div>
    <div id="tab-csp" class="tab-content active"><div class="loading">Loading CSP violations...</div></div>
    <div id="tab-bugs" class="tab-content"><div class="loading">Loading bug reports...</div></div>
    <div id="tab-banners" class="tab-content"><div class="loading">Loading banners...</div></div>
    <div id="tab-rewards" class="tab-content"><div class="loading">Loading rewards...</div></div>`;

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            const tab = document.getElementById('tab-' + btn.dataset.tab);
            tab.classList.add('active');
            if (!tab.dataset.loaded) { tab.dataset.loaded = '1'; loadTab(btn.dataset.tab); }
        });
    });
    loadTab('csp');
}

function loadTab(name) {
    if (name === 'csp') loadCsp();
    else if (name === 'bugs') loadBugs();
    else if (name === 'banners') loadBanners();
    else if (name === 'rewards') loadRewards();
}

async function loadCsp() {
    const el = document.getElementById('tab-csp');
    try {
        const data = await API('/admin/csp-violations');
        if (!data.length) { el.innerHTML = '<p style="text-align:center;color:#6a6a70;padding:40px">No violations reported</p>'; return; }
        el.innerHTML = `<div class="table-wrap"><table><thead><tr>
            <th class="sortable" onclick="sortTable('csp','id')">#</th>
            <th class="sortable" onclick="sortTable('csp','reported_at')">Reported</th>
            <th class="sortable" onclick="sortTable('csp','blocked_uri')">Blocked URI</th>
            <th class="sortable" onclick="sortTable('csp','violated_directive')">Directive</th>
            <th class="sortable" onclick="sortTable('csp','document_uri')">Document</th>
        </tr></thead><tbody id="csp-tbody"></tbody></table></div>`;
        window._cspData = data;
        renderCspTable(data);
    } catch(e) { el.innerHTML = '<p class="error">' + e.message + '</p>'; }
}

function renderCspTable(data) {
    const tbody = document.getElementById('csp-tbody');
    tbody.innerHTML = data.map(v => '<tr><td style="color:#6a6a70">' + v.id + '</td><td style="white-space:nowrap">' + v.reported_at + '</td><td style="color:#e0c060;word-break:break-all">' + (v.blocked_uri || '') + '</td><td>' + (v.violated_directive || '') + '</td><td style="font-size:11px;word-break:break-all;max-width:200px">' + (v.document_uri || '') + '</td></tr>').join('');
}

async function loadBugs() {
    const el = document.getElementById('tab-bugs');
    try {
        const data = await API('/admin/bug-reports');
        if (!data.length) { el.innerHTML = '<p style="text-align:center;color:#6a6a70;padding:40px">No bug reports</p>'; return; }
        el.innerHTML = `<div class="table-wrap"><table><thead><tr>
            <th class="sortable" onclick="sortTable('bugs','id')">#</th>
            <th class="sortable" onclick="sortTable('bugs','report_timestamp')">Date</th>
            <th class="sortable" onclick="sortTable('bugs','username')">User</th>
            <th class="sortable" onclick="sortTable('bugs','character_name')">Character</th>
            <th class="sortable" onclick="sortTable('bugs','category')">Category</th>
            <th class="sortable" onclick="sortTable('bugs','title')">Title</th>
            <th>Screenshot</th>
        </tr></thead><tbody id="bugs-tbody"></tbody></table></div>`;
        window._bugsData = data;
        renderBugsTable(data);
    } catch(e) { el.innerHTML = '<p class="error">' + e.message + '</p>'; }
}

function renderBugsTable(data) {
    const tbody = document.getElementById('bugs-tbody');
    tbody.innerHTML = data.map(b => '<tr><td style="color:#6a6a70">' + b.id + '</td><td style="white-space:nowrap">' + b.report_timestamp + '</td><td>' + (b.username || '') + '</td><td>' + (b.character_name || '') + '</td><td><span class="badge badge-' + (b.category === 'bug' ? 'yes' : 'no') + '">' + (b.category || '') + '</span></td><td class="bug-title" title="' + esc(b.title) + '">' + esc(b.title) + '</td><td>' + (b.has_screenshot ? '<a href="/api/game/bug-report/screenshot/' + b.id + '" target="_blank" style="color:#5dade2">View</a>' : '<span style="color:#4a4a50">No</span>') + '</td></tr>').join('');
}

async function loadBanners() {
    const el = document.getElementById('tab-banners');
    try {
        const data = await API('/admin/banners');
        if (!data.length) { el.innerHTML = '<p style="text-align:center;color:#6a6a70;padding:40px">No banners</p>'; return; }
        el.innerHTML = '<div class="card-grid">' + data.map(b => {
            const name = b.name || 'Unnamed';
            const desc = b.description || '';
            const start = b.start_time ? new Date(b.start_time * 1000).toLocaleDateString() : '?';
            const end = b.end_time ? new Date(b.end_time * 1000).toLocaleDateString() : '?';
            const pulls = b.total_pulls || 0;
            const winners = b.winners || 0;
            return '<div class="banner-card"><div class="name">' + esc(name) + '</div><div class="meta">' + start + ' → ' + end + '</div><div class="desc">' + esc(desc) + '</div><div><span class="stat">🎟️ ' + pulls + ' pulls</span><span class="stat">🏆 ' + winners + ' winners</span></div></div>';
        }).join('') + '</div>';
    } catch(e) { el.innerHTML = '<p class="error">' + e.message + '</p>'; }
}

async function loadRewards() {
    const el = document.getElementById('tab-rewards');
    try {
        const data = await API('/admin/rewards');
        if (!data.length) { el.innerHTML = '<p style="text-align:center;color:#6a6a70;padding:40px">No reward batches sent</p>'; return; }
        el.innerHTML = '<div class="card-grid">' + data.map(r => {
            const scope = r.scope || 'everyone';
            const subj = r.subject || '';
            const body = r.body || '';
            const count = r.recipient_count || 0;
            const time = r.created_at ? new Date(r.created_at * 1000).toLocaleString() : '?';
            let payload = '';
            try { const p = JSON.parse(r.reward_payload || '{}'); payload = Object.entries(p).map(([k,v]) => k + ': ' + v).join(', '); } catch {}
            return '<div class="banner-card"><div class="row" style="display:flex;justify-content:space-between;align-items:start;gap:8px"><span class="name" style="font-size:14px">' + esc(subj) + '</span><span class="reward-scope scope-' + scope + '">' + scope + '</span></div><div class="meta">' + time + ' · ' + count + ' recipients</div><div class="desc">' + esc(body) + '</div>' + (payload ? '<div style="font-size:11px;color:#c8a86e;margin-top:4px">' + payload + '</div>' : '') + '</div>';
        }).join('') + '</div>';
    } catch(e) { el.innerHTML = '<p class="error">' + e.message + '</p>'; }
}

let sortState = {};
function sortTable(tab, col) {
    const key = tab + '_' + col;
    const dir = sortState[key] === 'asc' ? 'desc' : 'asc';
    sortState[key] = dir;
    const data = window['_' + tab + 'Data'];
    if (!data) return;
    data.sort((a, b) => {
        let va = a[col] || '', vb = b[col] || '';
        if (col === 'id' || col === 'character_level') va = Number(va), vb = Number(vb);
        return dir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });
    if (tab === 'csp') renderCspTable(data);
    else if (tab === 'bugs') renderBugsTable(data);
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();
</script>
</body>
</html>
