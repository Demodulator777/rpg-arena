<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - RPG Arena</title>
<link rel="stylesheet" href="/css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:#0a0a0f; color:#e0dcd0; min-height:100vh; }
a { color:#c8a86e; text-decoration:none; }
a:hover { color:#e8c88e; }
h1 { text-align:center; padding:24px; font-size:28px; color:#f0e8d0; border-bottom:1px solid #2a2a35; margin-bottom:24px; }
.admin-server-bar {
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:#14141e; border:1px solid #2a2a35; border-radius:8px;
  max-width:1100px; margin:-8px auto 20px; padding:10px 16px; flex-wrap:wrap;
}
.admin-server-bar .asb-lbl { color:#8a8a90; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.admin-server-bar .asb-select {
  background:#1a1a28; border:1px solid #3a3a4a; border-radius:6px; color:#c8a86e;
  font-size:13px; font-weight:600; padding:6px 10px; cursor:pointer;
}
.admin-server-bar .asb-select:focus { border-color:#c8a86e; outline:none; }
.admin-server-bar .asb-hint { color:#6a6a70; font-size:11px; }
h2 { font-size:18px; margin-bottom:12px; color:#d4c8a0; border-left:3px solid #c8a86e; padding-left:10px; }
.container { max-width:1100px; margin:0 auto; padding:0 16px 40px; }

.tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:20px; border-bottom:1px solid #2a2a35; padding-bottom:0; }
.tab-btn { padding:10px 20px; background:#14141e; border:1px solid #2a2a35; border-bottom:none; border-radius:8px 8px 0 0; color:#8a8a90; cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; }
.tab-btn:hover { color:#e0dcd0; background:#1a1a28; }
.tab-btn.active { background:#0a0a0f; color:#c8a86e; border-color:#c8a86e; }
.tab-content { display:none; }
.tab-content.active { display:block; }

table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #2a2a35; }
th { color:#8a8a90; font-weight:500; text-transform:uppercase; font-size:10px; letter-spacing:.5px; position:sticky; top:0; background:#0a0a0f; z-index:1; }
tr:hover td { background:#1a1a28; }
.table-wrap { overflow-x:auto; max-height:500px; overflow-y:auto; border:1px solid #2a2a35; border-radius:8px; }
.loading { text-align:center; padding:40px; color:#6a6a70; font-size:14px; }
.error { color:#e06060; padding:12px; text-align:center; }
.badge { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.badge-yes { background:#1a4a1a; color:#60e060; }
.badge-no { background:#4a1a1a; color:#e06060; }
.badge-warn { background:#4a3a1a; color:#e0c060; }
.card-compact { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:16px; margin-bottom:12px; }
.card-compact .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.card-compact .row + .row { margin-top:8px; padding-top:8px; border-top:1px solid #2a2a35; }
.card-compact .lbl { color:#8a8a90; font-size:11px; text-transform:uppercase; letter-spacing:.5px; min-width:80px; }
.card-compact .val { color:#e0dcd0; font-size:13px; word-break:break-word; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
.banner-card { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:14px; }
.banner-card .name { font-size:15px; font-weight:600; color:#f0e8d0; }
.banner-card .meta { font-size:11px; color:#6a6a70; margin:4px 0 8px; }
.banner-card .desc { font-size:12px; color:#b0a890; margin-bottom:8px; }
.banner-card .stat { display:inline-block; margin-right:12px; font-size:11px; color:#8a8a90; }
th.sortable { cursor:pointer; }
th.sortable:hover { color:#c8a86e; }
.count-badge { display:inline-block; background:#2a2a35; color:#c8a86e; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:6px; }
.bug-title { max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.reward-scope { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; text-transform:uppercase; }
.scope-all { background:#1a3a5a; color:#60a0e0; }
.scope-everyone { background:#3a1a5a; color:#b060e0; }
/* ── Database Admin ───────────────────────────────────────────────── */
.db-admin-layout { display:flex; gap:16px; padding:10px; height:calc(100vh - 180px); }
.db-table-list { width:200px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; overflow-y:auto; }
.db-table-list button {
  background:#14141e; border:1px solid #2a2a35; border-radius:6px; color:#b0a8a0;
  padding:6px 12px; cursor:pointer; font-size:13px; text-align:left; transition:all .15s;
  font-weight:500; line-height:1.3; white-space:nowrap;
}
.db-table-list button:hover { background:#1e1e2e; border-color:#c8a86e; color:#e0dcd0; }
.db-table-list button.active { background:#1a1a28; border-color:#c8a86e; color:#c8a86e; font-weight:600; }

.db-content { flex-grow:1; overflow:auto; min-width:0; }
.db-content .no-data { text-align:center; padding:40px; color:#6a6a70; font-size:14px; }

.db-scroll { border:1px solid #2a2a35; border-radius:8px; }
.db-scroll table { border-collapse:collapse; min-width:100%; }
.db-scroll th {
  padding:6px 10px; border:1px solid #2a2a35; background:#16161f; color:#8a8a90;
  font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
  white-space:nowrap; position:sticky; top:0; z-index:1;
}
.db-scroll td {
  padding:5px 10px; border:1px solid #2a2a35; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:200px;
}
.db-scroll tr:hover td { background:#161621; }

.db-scroll .dsp {
  font-size:12px; line-height:1.4; cursor:text; padding:2px 0;
}
.db-scroll .dsp:hover { color:#e8e0d0; }
.db-scroll .ed {
  width:100%; padding:3px 5px;
  border:1px solid #3a3a4a; background:#1a1a28; color:inherit;
  border-radius:3px; font:inherit; font-size:12px; box-sizing:border-box;
}
.db-scroll .ed:focus { border-color:#c8a86e; outline:none; box-shadow:0 0 0 2px #c8a86e33; }
.db-scroll .td-actions { padding:5px 10px; text-align:center; white-space:nowrap; }

/* ── SQL Console ──────────────────────────────────────────────────── */
.db-sql-console { margin-top:12px; border:1px solid #2a2a35; border-radius:8px; background:#0e0e16; }
.db-sql-header { padding:10px 14px; cursor:pointer; font-size:13px; font-weight:600; color:#c8a86e; user-select:none; display:flex; align-items:center; gap:8px; }
.db-sql-header:hover { background:#14141e; }
.db-sql-arrow { font-size:10px; transition:transform .15s; }
.db-sql-body { display:none; padding:10px 14px 14px; border-top:1px solid #2a2a35; }
.db-sql-input { width:100%; min-height:80px; padding:10px; border:1px solid #3a3a4a; border-radius:6px; background:#1a1a28; color:#e0dcd0; font-family:'Consolas','Courier New',monospace; font-size:13px; resize:vertical; box-sizing:border-box; }
.db-sql-input:focus { border-color:#c8a86e; outline:none; box-shadow:0 0 0 2px #c8a86e33; }
.db-sql-toolbar { margin-top:8px; display:flex; gap:6px; }
.db-sql-results { margin-top:10px; }
.db-sql-error { color:#e06060; padding:10px; background:#1a0a0a; border:1px solid #3a1a1a; border-radius:6px; font-family:monospace; font-size:12px; }

.db-table-select {
  display:none; width:100%; padding:8px 10px; margin-bottom:4px;
  background:#14141e; border:1px solid #2a2a35; border-radius:6px;
  color:#e0dcd0; font-size:13px; font-weight:500;
  cursor:pointer; -webkit-appearance:menulist; appearance:auto;
}
.db-table-select:focus { border-color:#c8a86e; outline:none; }
.db-btn { display:inline-block; padding:4px 10px; border:none; border-radius:4px;
  cursor:pointer; font-size:11px; font-weight:600; transition:all .15s; line-height:1.4; }
.db-btn:hover { filter:brightness(1.2); transform:translateY(-1px); }
.db-btn:active { transform:translateY(0); }
.db-btn-edit { background:#2a5a2a; color:#b0f0b0; }
.db-btn-apply { background:#1a5a7a; color:#90d0f0; }
.db-btn-cancel { background:#5a2a2a; color:#f0b0b0; }
.db-btn-del { background:#7a1a1a; color:#f0a0a0; }

.db-pagination { margin-top:10px; display:flex; gap:4px; flex-wrap:wrap; }
.db-pagination button {
  background:#14141e; border:1px solid #2a2a35; border-radius:4px; color:#8a8a90;
  padding:4px 10px; cursor:pointer; font-size:11px; font-weight:600; transition:all .15s;
}
.db-pagination button:hover { border-color:#c8a86e; color:#e0dcd0; }
.db-pagination button.active { background:#c8a86e; border-color:#c8a86e; color:#0a0a0f; }

/* ── Ring Forge ────────────────────────────────────────────────────── */
.rf-layout { display:flex; gap:16px; align-items:flex-start; min-width:0; }
.rf-rail { width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
.rf-card { background:#14141e; border:1px solid #2a2a35; border-radius:8px; padding:16px; }
.rf-card h3 {
  font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; font-weight:600;
  color:#c8a86e; text-transform:uppercase; letter-spacing:.6px; margin:0 0 12px;
}
.rf-add-btn {
  width:100%; padding:10px; border-radius:6px; border:1px dashed #8a7a50;
  background:transparent; color:#c8a86e; cursor:pointer; font-size:13px; font-weight:600;
}
.rf-add-btn:hover { border-color:#e8c88e; color:#e8c88e; }
.rf-layers { display:flex; flex-direction:column; gap:4px; max-height:240px; overflow-y:auto; }
.rf-empty { color:#6a6a70; font-size:12px; text-align:center; line-height:1.5; padding:14px 6px; }
.rf-layer {
  display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px;
  border:1px solid transparent; cursor:pointer;
}
.rf-layer:hover { background:#1a1a28; }
.rf-layer.selected { background:#1e1e30; border-color:#8b6bff; }
.rf-thumb {
  width:32px; height:32px; border-radius:4px; flex-shrink:0; overflow:hidden;
  background-image:
    linear-gradient(45deg,#2a2438 25%,transparent 25%),
    linear-gradient(-45deg,#2a2438 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#2a2438 75%),
    linear-gradient(-45deg,transparent 75%,#2a2438 75%);
  background-size:10px 10px; background-position:0 0,0 5px,5px -5px,-5px 0;
  background-color:#0d0b14;
  display:flex; align-items:center; justify-content:center;
}
.rf-thumb img { max-width:100%; max-height:100%; display:block; }
.rf-layer-name { flex:1; font-size:12px; color:#e0dcd0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rf-icon-btn { background:none; border:none; color:#8a8a90; cursor:pointer; padding:2px 5px; font-size:12px; border-radius:3px; line-height:1; }
.rf-icon-btn:hover { color:#e0dcd0; background:#2a2a38; }
.rf-icon-btn.del:hover { color:#e06060; }
.rf-field { margin-bottom:12px; }
.rf-field-label { display:flex; justify-content:space-between; font-size:11px; color:#8a8a90; margin-bottom:5px; }
.rf-field-label b { color:#e0dcd0; font-weight:500; font-variant-numeric:tabular-nums; }
.rf-field input[type=range] { width:100%; accent-color:#8b6bff; height:4px; }
.rf-center-btn {
  width:100%; padding:7px; border-radius:6px; border:1px solid #2a2a35;
  background:#1a1a28; color:#e0dcd0; font-size:12px; cursor:pointer;
}
.rf-center-btn:hover { border-color:#8a7a50; }
.rf-no-sel { color:#6a6a70; font-size:12px; }

.rf-stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:22px; }
.rf-stage-block { display:flex; flex-direction:column; align-items:center; gap:8px; }
.rf-stage-label { font-size:11px; letter-spacing:.5px; color:#8a7a50; text-transform:uppercase; }
.rf-checker {
  background-image:
    linear-gradient(45deg,#241d33 25%,transparent 25%),
    linear-gradient(-45deg,#241d33 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#241d33 75%),
    linear-gradient(-45deg,transparent 75%,#241d33 75%);
  background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0;
  background-color:#171220; border-radius:10px;
}
#rf-editCanvas { cursor:grab; border-radius:10px; box-shadow:0 0 0 1px #2a2a35; }
#rf-editCanvas.dragging { cursor:grabbing; }
.rf-stage-hint { font-size:11px; color:#6a6a70; max-width:420px; text-align:center; line-height:1.5; }
.rf-preview-frame {
  width:210px; height:210px; border-radius:50%; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 1px #2a2a35, 0 0 40px -10px #8b6bff33;
}
#rf-previewCanvas { animation: rf-spin 6s linear infinite; }
@keyframes rf-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

.rf-save-bar { display:flex; gap:8px; align-items:center; width:100%; max-width:520px; }
.rf-ring-id-input {
  flex:1; min-width:160px; padding:10px; border:1px solid #3a3a4a; border-radius:6px;
  background:#1a1a28; color:#e0dcd0; font-size:13px;
}
.rf-ring-id-input:focus { border-color:#c8a86e; outline:none; box-shadow:0 0 0 2px #c8a86e33; }
.rf-export-btn, .rf-save-btn {
  padding:10px 18px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer;
  font-family:'Segoe UI',system-ui,sans-serif;
}
.rf-export-btn { border:1px solid #c8a86e; background:transparent; color:#c8a86e; }
.rf-export-btn:hover { background:#1a1a28; }
.rf-save-btn { border:1px solid #c8a86e; background:#c8a86e; color:#0a0a0f; }
.rf-save-btn:hover { background:#e8c88e; }
.rf-status { font-size:12px; min-height:16px; margin-top:6px; }

.rf-textmark-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
.rf-textmark-row select {
  padding:8px 10px; border:1px solid #3a3a4a; border-radius:6px; background:#1a1a28; color:#e0dcd0; font-size:12px;
}
.rf-del-btn {
  padding:10px 14px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; font-family:'Segoe UI',system-ui,sans-serif;
  border:1px solid #7a3a3a; background:transparent; color:#e08080;
}
.rf-del-btn:hover { background:#2a1a1a; }
.rf-textmark-coords {
  font-size:12px; color:#c8a86e; font-family:Consolas,monospace; letter-spacing:.3px;
  background:#10101a; border:1px solid #2a2a35; border-radius:6px; padding:8px 12px; min-width:260px; text-align:center;
}
.rf-textmark-controls {
  display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center;
  font-size:11px; color:#c8a86e; font-family:'Segoe UI',system-ui,sans-serif;
}
.rf-textmark-controls label { display:flex; align-items:center; gap:3px; }
.rf-textmark-controls input[type=number] {
  width:56px; padding:3px 5px; border:1px solid #3a3a4a; border-radius:4px;
  background:#1a1a28; color:#e0dcd0; font-size:11px; font-family:Consolas,monospace;
}
.rf-textmark-controls input[type=range] { height:14px; }
#rf-textmark { cursor:default; border-radius:10px; box-shadow:0 0 0 1px #2a2a35; }
.rf-del-btn {
  padding:10px 14px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer; font-family:'Segoe UI',system-ui,sans-serif;
  border:1px solid #7a3a3a; background:transparent; color:#e08080;
}
.rf-del-btn:hover { background:#2a1a1a; }

.rf-ring-item {
  display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid #2a2a35;
  border-radius:6px; margin-bottom:6px; background:#0e0e16;
}
.rf-ring-item img { width:40px; height:40px; border-radius:4px; object-fit:contain; }
.rf-ring-name { flex:1; font-size:12px; color:#e0dcd0; word-break:break-all; }
@media (max-width:800px) {
  .rf-layout { flex-direction:column; }
  .rf-rail { width:100%; }
  .rf-save-bar { flex-wrap:wrap; }
  .db-admin-layout { flex-direction:column; height:auto; }
  .db-table-list { width:100%; flex-direction:row; flex-wrap:wrap; }
  .db-table-list button { flex:1 0 auto; text-align:center; }
  .db-table-list .db-table-select { display:none; }
}
@media (max-width:640px) {
  .db-admin-layout { height:auto; }
  .db-table-list { flex-direction:column; }
  .db-table-list button { display:none; }
  .db-table-list .db-table-select { display:block; width:100%; }
  .db-content { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .db-scroll td { max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .db-pagination button { padding:4px 6px; font-size:10px; }
}
@media (max-width:640px) {
  .tabs { flex-wrap:wrap; gap:2px; }
  .tab-btn { flex:1 1 auto; font-size:11px; padding:8px 6px; text-align:center; }
  .container { padding:0 6px 20px; }
  h1 { font-size:20px; padding:16px; }
  .table-wrap { max-height:none; font-size:11px; }
  .table-wrap th, .table-wrap td { padding:4px 5px; }
  .card-grid { grid-template-columns:1fr; }
  .db-scroll table { font-size:11px; }
  .db-scroll th, .db-scroll td { padding:3px 5px; }
  .db-scroll .dsp { max-width:120px; font-size:11px; }
}
</style>
</head>
<body>
<h1>Admin Panel</h1>
<div class="admin-server-bar">
  <span class="asb-lbl">Server</span>
  <select id="admin-server-select" class="asb-select">
    <option value="beta">Beta</option>
    <option value="server1">Server 1 (Global)</option>
  </select>
  <span class="asb-hint">Switch which server this panel manages. Each server has its own database.</span>
</div>
<div class="container" id="app">
  <div class="loading" id="init-loading">Checking access...</div>
</div>
<script src="/admin/panel.js?v=2026-09-30-weekly-totals"></script>
</body>
</html>
