<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#eee;padding:20px}
h1{color:#f1c40f;margin-bottom:20px}
.btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn-primary{background:#3498db;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn:disabled{opacity:0.5;cursor:not-allowed}
input,select{padding:8px;border-radius:4px;border:1px solid #444;background:#2c2c4a;color:#fff;font-size:14px}
table{border-collapse:collapse;width:100%;margin-top:20px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #333}
th{background:#2c2c4a}
.status-active{color:#27ae60}
.status-inactive{color:#e74c3c}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px}
.form-group input,.form-group textarea{width:100%;max-width:400px}
textarea{height:100px;padding:8px;border-radius:4px;border:1px solid #444;background:#2c2c4a;color:#fff;font-size:14px;font-family:monospace}
#message{padding:10px;border-radius:4px;margin-bottom:20px;display:none}
#message.success{background:#27ae60;display:block}
#message.error{background:#e74c3c;display:block}
</style>
</head>
<body>
<h1>Banner Admin</h1>
<div id="message"></div>

<h2>Current Banner</h2>
<div id="current-banner">
<button class="btn btn-primary" onclick="loadBanners()">Refresh</button>
</div>

<h2>All Banners</h2>
<table id="banners-table">
<thead><tr><th>ID</th><th>Name</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr></thead>
<tbody></tbody>
</table>

<h2>Create New Banner</h2>
<form id="create-form">
<div class="form-group">
<label>Name</label>
<input type="text" name="name" required placeholder="Banner Name">
</div>
<div class="form-group">
<label>Image Key</label>
<input type="text" name="image" placeholder="spiteforged">
</div>
<div class="form-group">
<label>Start (Unix timestamp)</label>
<input type="number" name="start_at" required>
</div>
<div class="form-group">
<label>End (Unix timestamp)</label>
<input type="number" name="end_at" required>
</div>
<div class="form-group">
<label>Loot Table (JSON)</label>
<textarea name="loot_table" placeholder='[{"id":"item1","name":"Item","type":"weapon","rarity":"legendary"}]'></textarea>
</div>
<button type="submit" class="btn btn-primary">Create Banner</button>
</form>

<script>
const API = '/admin/banner';
let adminKey = '';
function getKey() {
    const params = new URLSearchParams(location.search);
    return params.get('key') || '';
}
async function api(method, path, body) {
    const url = API + path + (path.includes('?') ? '&' : '?') + 'key=' + getKey();
    const res = await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Error');
    }
    return res.json();
}
function showMsg(msg, isError) {
    const el = document.getElementById('message');
    el.textContent = msg;
    el.className = isError ? 'error' : 'success';
    setTimeout(() => el.style.display = 'none', 5000);
}
function formatTs(ts) {
    return new Date(ts * 1000).toLocaleString();
}
async function loadBanners() {
    try {
        const data = await api('GET', '/list');
        const tbody = document.querySelector('#banners-table tbody');
        tbody.innerHTML = data.banners.map(b => {
            const now = Math.floor(Date.now() / 1000);
            const active = b.start_at <= now && b.end_at > now;
            return `<tr>
                <td>${b.id}</td>
                <td>${b.name}</td>
                <td>${formatTs(b.start_at)}</td>
                <td>${formatTs(b.end_at)}</td>
                <td class="${active ? 'status-active' : 'status-inactive'}">${active ? 'Active' : 'Inactive'}</td>
                <td>
                    <button class="btn btn-danger" onclick="deleteBanner(${b.id})">Delete</button>
                </td>
            </tr>`;
        }).join('');
        document.getElementById('current-banner').innerHTML = data.banners.find(b => {
            const now = Math.floor(Date.now() / 1000);
            return b.start_at <= now && b.end_at > now;
        }) ? `<div class="status-active">Banner is ACTIVE</div>` : `<div class="status-inactive">No active banner</div>`;
    } catch (e) {
        showMsg(e.message, true);
    }
}
async function deleteBanner(id) {
    if (!confirm('Delete banner ' + id + '?')) return;
    try {
        await api('DELETE', '/' + id);
        showMsg('Deleted', false);
        loadBanners();
    } catch (e) {
        showMsg(e.message, true);
    }
}
document.getElementById('create-form').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
        name: fd.get('name'),
        image: fd.get('image') || null,
        start_at: parseInt(fd.get('start_at')),
        end_at: parseInt(fd.get('end_at')),
        loot_table: fd.get('loot_table') ? JSON.parse(fd.get('loot_table')) : []
    };
    try {
        await api('POST', '/create', data);
        showMsg('Created', false);
        e.target.reset();
        loadBanners();
    } catch (e) {
        showMsg(e.message, true);
    }
};
loadBanners();
</script>
</body>
</html>
