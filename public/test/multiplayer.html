<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Dungeon</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }

        #lobby { display: flex; position: fixed; inset: 0; background: #111; z-index: 500; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
        #lobby.hide { display: none; }
        #lobby input { background: #222; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 16px; width: 220px; }
        #lobby input.code { width: 120px; text-align: center; text-transform: uppercase; font-size: 22px; letter-spacing: 6px; }
        #lobby button { background: #4a7; border: none; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        #lobby button:hover { background: #5c9; }
        #lobby button.secondary { background: #555; }
        #lobby button.secondary:hover { background: #777; }
        #lobby .status { color: #999; font-size: 14px; }
        #lobby .error { color: #f55; font-size: 14px; }

        #game-world { position: relative; width: 5000px; height: 5000px; transform-origin: 0 0; }
        #map { position: absolute; width: 5000px; height: 5000px; background: #1a1a1a; border: 20px solid #555; box-sizing: border-box; }
        .wall { position: absolute; background: #444; border: 1px solid #222; box-sizing: border-box; }

        #player { position: absolute; width: 120px; height: 120px; z-index: 10; pointer-events: none; transform: translate(-50%, -50%); }
        .player-sprite { width: 100%; height: 100%; background-image: url('/images/assets/roguelike3.png'); background-repeat: no-repeat; background-size: 500% 500%; background-position: 0% 0%; clip-path: inset(21px 18px 9px 18px); }
        .other-player { position: absolute; width: 120px; height: 120px; z-index: 9; pointer-events: none; transform: translate(-50%, -50%); }
        .other-player .player-sprite { opacity: 0.7; }
        .other-player .name-tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 1px 6px; border-radius: 3px; font-size: 11px; color: #fff; white-space: nowrap; pointer-events: none; }

        .monster { position: absolute; width: 40px; height: 40px; background-repeat: no-repeat; background-size: 500% 500%; background-position: 0% 0%; z-index: 5; transition: filter 0.1s; }
        .monster.dead { display: none; }
        .monster.monster-hit { filter: brightness(2) hue-rotate(180deg); }
        .monster-hp { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #222; border: 1px solid #111; border-radius: 2px; z-index: 6; overflow: hidden; }
        .monster-hp-fill { height: 100%; background: #0c0; border-radius: 1px; transition: width 0.15s; }
        #player.hit-flash .player-sprite { filter: brightness(2) saturate(0) !important; }

        .chest { position: absolute; width: 40px; height: 32px; background: #c8943c; border: 2px solid #8b5e3c; border-radius: 4px; z-index: 5; box-shadow: inset 0 -6px 0 #8b5e3c, 0 0 8px rgba(200,148,60,0.4); pointer-events: auto; }
        .chest::before { content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 8px; height: 6px; background: #8b5e3c; border-radius: 2px; box-shadow: 0 0 4px #f0c840; }
        .chest.found { opacity: 0.3; filter: grayscale(1); pointer-events: none; }

        .shop { position: absolute; width: 36px; height: 36px; background: #484; border: 2px solid #6a6; border-radius: 6px; z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; pointer-events: auto; animation: pulse-shop 2s ease-in-out infinite; }
        .shop::before { content: '$'; font-weight: bold; }
        @keyframes pulse-shop { 0%,100% { box-shadow: 0 0 8px rgba(80,180,80,0.3); } 50% { box-shadow: 0 0 20px rgba(80,180,80,0.6); } }

        .decal { position: absolute; pointer-events: none; opacity: 0.7; z-index: 1; }
        .trap-zone { position: absolute; background: rgba(255,0,0,0.15); border: 2px dashed rgba(255,0,0,0.4); pointer-events: none; z-index: 2; }
        .teleport-zone { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: rgba(100,200,255,0.2); border: 2px solid rgba(100,200,255,0.4); z-index: 3; pointer-events: none; animation: pulse-teleport 2s ease-in-out infinite; }
        @keyframes pulse-teleport { 0%,100% { box-shadow: 0 0 8px rgba(100,200,255,0.3); } 50% { box-shadow: 0 0 20px rgba(100,200,255,0.6); } }
        .beam-line { position: absolute; background: rgba(100,200,255,0.08); border: 1px solid rgba(100,200,255,0.2); pointer-events: none; z-index: 2; }
        #exit-zone { position: absolute; width: 60px; height: 60px; border: 3px dashed #3a6; border-radius: 50%; z-index: 3; pointer-events: none; animation: pulse-exit 2s ease-in-out infinite; }
        #entrance-zone { position: absolute; width: 60px; height: 60px; border: 3px dashed #a6a; border-radius: 50%; z-index: 3; pointer-events: none; animation: pulse-entrance 2s ease-in-out infinite; }
        @keyframes pulse-exit { 0%,100% { opacity: 0.6; box-shadow: 0 0 10px rgba(60,170,100,0.3); } 50% { opacity: 1; box-shadow: 0 0 25px rgba(60,170,100,0.6); } }
        @keyframes pulse-entrance { 0%,100% { opacity: 0.6; box-shadow: 0 0 10px rgba(170,100,170,0.3); } 50% { opacity: 1; box-shadow: 0 0 25px rgba(170,100,170,0.6); } }

        #scan-field { position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 3px solid rgba(0,200,255,0.6); background: rgba(0,200,255,0.06); z-index: 8; pointer-events: none; transform: translate(-50%,-50%); opacity: 0; transition: opacity 0.15s; box-shadow: 0 0 40px rgba(0,200,255,0.15), inset 0 0 40px rgba(0,200,255,0.08); }
        #scan-field.show { opacity: 1; animation: scan-pulse 0.4s ease-in-out infinite alternate; }
        @keyframes scan-pulse { 0% { box-shadow: 0 0 20px rgba(0,200,255,0.08), inset 0 0 20px rgba(0,200,255,0.04); border-color: rgba(0,200,255,0.3); } 100% { box-shadow: 0 0 60px rgba(0,200,255,0.25), inset 0 0 60px rgba(0,200,255,0.12); border-color: rgba(0,200,255,0.8); } }

        #fog { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: #000; }

        #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; justify-content: space-between; padding: 8px 12px; pointer-events: none; }
        #hud > * { pointer-events: auto; }
        #player-hp-outer { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: 200px; height: 16px; background: #222; border: 2px solid #555; border-radius: 8px; z-index: 200; overflow: hidden; }
        #player-hp-inner { height: 100%; background: #e33; border-radius: 6px; width: 100%; transition: width 0.2s; }
        #room-code { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); margin-top: 24px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; font-size: 13px; color: #aaa; z-index: 200; pointer-events: none; }
        .hud-btn { position: fixed; top: 8px; right: 8px; z-index: 200; background: rgba(30,30,30,0.85); border: 2px solid #888; border-radius: 6px; color: #eee; padding: 4px 10px; cursor: pointer; font-size: 12px; }
        #scan-btn { position: fixed; top: auto; bottom: max(80px, env(safe-area-inset-bottom)); right: max(30px, env(safe-area-inset-right)); z-index: 200; width: 70px; height: 70px; background: #48f; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 0.8rem; box-shadow: 0 0 15px rgba(68,136,255,0.4); cursor: pointer; }
        #action-btn { position: fixed; bottom: max(80px, env(safe-area-inset-bottom)); right: max(110px, env(safe-area-inset-right)); z-index: 200; width: 80px; height: 80px; background: #f33; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 0.85rem; box-shadow: 0 0 20px rgba(255,0,0,0.5); cursor: pointer; }
        #inv-btn { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 200; width: 44px; height: 44px; background: rgba(30,30,30,0.85); border: 2px solid #888; border-radius: 8px; color: #eee; font-size: 14px; cursor: pointer; }

        #player-list { position: fixed; top: 44px; left: 8px; z-index: 200; padding: 4px 10px; background: rgba(0,0,0,0.5); border-radius: 6px; pointer-events: none; font-size: 12px; }
        #player-list div { margin: 2px 0; }

        #interact-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
        #interact-btn { display: none; background: rgba(0,0,0,0.75); border: 1px solid #f0c840; border-radius: 6px; color: #f0c840; padding: 6px 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
        #interact-btn.show { display: block; }

        #inv-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(20,20,20,0.95); border: 1px solid #555; border-radius: 8px; padding: 16px; z-index: 300; min-width: 220px; color: #eee; font-size: 14px; }
        #inv-panel.show { display: block; }
        .inv-row { display: flex; align-items: center; margin: 4px 0; }
        #message { display: none; position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #f0c840; border-radius: 8px; padding: 8px 20px; font-size: 15px; color: #f0c840; z-index: 300; white-space: nowrap; pointer-events: none; }
        #message.show { display: block; }

        #scan-btn:disabled { background: #555; box-shadow: none; cursor: default; }

        #controls { position: fixed; bottom: 80px; left: 10px; z-index: 100; display: none; }
        #controls.show { display: flex; gap: 4px; }
        #controls .dpad { display: grid; grid-template-columns: 56px 56px 56px; gap: 2px; }
        #controls .dpad button { width: 56px; height: 56px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; font-size: 16px; cursor: pointer; touch-action: none; }
        #controls .dpad .blank { visibility: hidden; }
    </style>
</head>
<body>
    <div id="lobby">
        <h2>Multiplayer Dungeon</h2>
        <input id="lobby-name" placeholder="Your name" maxlength="20" value="Adventurer">
        <div style="display:flex;gap:10px">
            <button id="btn-create">Create Room</button>
            <button id="btn-join" class="secondary">Join Room</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
            <input id="lobby-code" class="code" placeholder="CODE" maxlength="4">
        </div>
        <div class="status">Level: <input id="lobby-level" type="number" min="1" value="1" style="width:50px;font-size:14px;padding:4px"></div>
        <div id="lobby-error" class="error"></div>
    </div>

    <div id="game-container">
        <div id="game-world">
            <div id="map"></div>
            <div id="scan-field"></div>
            <div id="player"><div class="player-sprite" id="playerSprite"></div></div>
        </div>
        <div id="player-hp-outer"><div id="player-hp-inner"></div></div>
        <div id="room-code"></div>
        <div id="player-list"></div>
        <div id="interact-area"><button id="interact-btn">Open</button></div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <button id="action-btn">BURST</button>
        <button id="scan-btn">SCAN</button>
        <button id="inv-btn">Inv</button>
        <div id="fog"></div>
        <div id="inv-panel"></div>
        <div id="message"></div>
    </div>

    <script src="multiplayer.js"></script>
</body>
</html>
