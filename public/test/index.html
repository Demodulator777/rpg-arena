<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Game Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #unity-container { width: 960px; height: 600px; }
        #unity-canvas { width: 100%; height: 100%; background: #000; display: block; }
        #unity-loading-bar { background: #333; height: 20px; margin-top: 10px; border-radius: 10px; overflow: hidden; }
        #unity-progress-bar-full { background: #9b59b6; height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
    <script src="/test/unity-init.js"></script>
</body>
</html>
