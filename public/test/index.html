<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Game Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #unity-container { width: 960px; height: 600px; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>
    <script src="Build/clean.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var buildUrl = "Build";
        var config = {
            dataUrl: buildUrl + "/clean.data",
            frameworkUrl: buildUrl + "/clean.framework.js",
            codeUrl: buildUrl + "/clean.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "My project",
            productVersion: "1.0",
        };
        createUnityInstance(canvas, config).then((unityInstance) => {
            console.log("Unity loaded!");
        }).catch((message) => {
            alert(message);
        });
    </script>
</body>
</html>
