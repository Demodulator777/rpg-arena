<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Walk</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #map { position: absolute; width: 2000px; height: 2000px; background: #1a1a1a; }
        .wall { position: absolute; background: #444; border: 1px solid #222; box-sizing: border-box; }
        
        #player { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; z-index: 10; pointer-events: none; }
        .player-sprite { width: 100%; height: 100%; background-image: url('/images/assets/roguelike1.png'); background-repeat: no-repeat; background-size: 500% 500%; }

        .player-sprite { width: 100%; height: 100%; background-image: url('/images/assets/roguelike1.png'); background-repeat: no-repeat; background-size: 500% 500%; }

        /* Joystick - Responsive */
        #joystick-area { position: absolute; bottom: 50px; left: 50px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
        #joystick-knob { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 45px; left: 45px; }

        /* Action Button */
        #action-btn { position: absolute; bottom: 50px; right: 50px; width: 120px; height: 120px; background: #f33; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        
        @media (max-width: 600px) {
            #joystick-area { width: 120px; height: 120px; bottom: 20px; left: 20px; }
            #joystick-knob { width: 40px; height: 40px; top: 40px; left: 40px; }
            #action-btn { width: 90px; height: 90px; bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        <div id="player"><div class="player-sprite" id="playerSprite"></div></div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <button id="action-btn">BURST</button>
    </div>
    <script src="map-walk.js"></script>
</body>
</html>
