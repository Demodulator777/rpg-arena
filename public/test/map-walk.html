<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Walk</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #map { position: absolute; width: 2000px; height: 2000px; background: #222; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 50px 50px; }
        #player { position: absolute; width: 120px; height: 120px; background: #0af; border-radius: 50%; transition: transform 0.1s linear; z-index: 10; }
        
        /* Joystick */
        #joystick-area { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
        #joystick-knob { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 35px; left: 35px; }

        /* Action Button */
        #action-btn { position: absolute; bottom: 30px; right: 30px; width: 100px; height: 100px; background: #f33; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        <div id="player"></div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <button id="action-btn">BURST</button>
    </div>
    <script src="map-walk.js"></script>
</body>
</html>
