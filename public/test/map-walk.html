<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Walk</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100dvh; overflow: hidden; }

        #game-world { position: relative; width: 5000px; height: 5000px; transform-origin: 0 0; }
        #map { position: absolute; width: 5000px; height: 5000px; background: #1a1a1a; border: 20px solid #555; box-sizing: border-box; }
        .wall { position: absolute; background: #444; border: 1px solid #222; box-sizing: border-box; }
        
        #player { position: absolute; width: 120px; height: 120px; z-index: 10; pointer-events: none; transform: translate(-50%, -50%); }
        .player-sprite { width: 100%; height: 100%; background-image: url('/images/assets/roguelike3.png'); background-repeat: no-repeat; background-size: 500% 500%; background-position: 0% 0%; clip-path: inset(21px 18px 9px 18px); }

        .chest { position: absolute; width: 40px; height: 32px; background: #c8943c; border: 2px solid #8b5e3c; border-radius: 4px; z-index: 5; box-shadow: inset 0 -6px 0 #8b5e3c, 0 0 8px rgba(200,148,60,0.4); pointer-events: auto; }
        .chest::before { content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 8px; height: 6px; background: #8b5e3c; border-radius: 2px; box-shadow: 0 0 4px #f0c840; }
        .chest.found { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        
        .monster { position: absolute; width: 40px; height: 40px; background-image: url('/images/assets/goblin.png'); background-repeat: no-repeat; background-size: 500% 500%; background-position: 0% 0%; z-index: 5; }
        .monster.dead { display: none; }
        .monster-hp { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #222; border: 1px solid #111; border-radius: 2px; z-index: 6; overflow: hidden; }
        .monster-hp-fill { height: 100%; background: #0c0; border-radius: 1px; transition: width 0.15s; }
        
        #interact-prompt { display: none; position: fixed; z-index: 100; padding: 6px 16px; background: rgba(0,0,0,0.75); border: 1px solid #f0c840; border-radius: 6px; color: #f0c840; font-size: 14px; font-weight: bold; pointer-events: auto; cursor: pointer; transform: translate(-50%, -100%); white-space: nowrap; }
        #interact-prompt.show { display: block; }

        #joystick-area { position: fixed; bottom: max(80px, env(safe-area-inset-bottom)); left: max(60px, env(safe-area-inset-left)); width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; z-index: 200; }
        #joystick-knob { position: absolute; width: 64px; height: 64px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 43px; left: 43px; }

        #action-btn { position: fixed; bottom: max(80px, env(safe-area-inset-bottom)); right: max(30px, env(safe-area-inset-right)); width: 100px; height: 100px; background: #f33; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 1rem; box-shadow: 0 0 20px rgba(255,0,0,0.5); z-index: 200; }

        #player-hp-outer { position: fixed; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: 200px; height: 16px; background: #222; border: 2px solid #555; border-radius: 8px; z-index: 200; overflow: hidden; }
        #player-hp-inner { height: 100%; background: #e33; border-radius: 6px; width: 100%; }

        #level-label { position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; font-size: 14px; z-index: 200; pointer-events: none; }
        #level-selector { position: fixed; top: max(20px, env(safe-area-inset-top)); left: max(160px, env(safe-area-inset-left)); z-index: 200; display: flex; gap: 4px; align-items: center; }
        #level-selector input { width: 48px; background: rgba(0,0,0,0.6); border: 1px solid #555; color: #fff; padding: 3px 6px; border-radius: 3px; font-size: 13px; }
        #level-selector button { background: #444; border: 1px solid #666; color: #fff; padding: 3px 8px; border-radius: 3px; font-size: 13px; cursor: pointer; }
        #level-selector button:hover { background: #666; }
        #exit-zone { position: absolute; width: 60px; height: 60px; border: 3px dashed #3a6; border-radius: 50%; z-index: 3; pointer-events: none; animation: pulse-exit 2s ease-in-out infinite; }
        #entrance-zone { position: absolute; width: 60px; height: 60px; border: 3px dashed #a6a; border-radius: 50%; z-index: 3; pointer-events: none; animation: pulse-entrance 2s ease-in-out infinite; }
        @keyframes pulse-exit { 0%,100% { opacity: 0.6; box-shadow: 0 0 10px rgba(60,170,100,0.3); } 50% { opacity: 1; box-shadow: 0 0 25px rgba(60,170,100,0.6); } }
        @keyframes pulse-entrance { 0%,100% { opacity: 0.6; box-shadow: 0 0 10px rgba(170,100,170,0.3); } 50% { opacity: 1; box-shadow: 0 0 25px rgba(170,100,170,0.6); } }
        @keyframes pulse-teleport { 0%,100% { opacity: 0.6; box-shadow: 0 0 8px rgba(100,200,255,0.3); } 50% { opacity: 1; box-shadow: 0 0 20px rgba(100,200,255,0.6); } }

        #fog { position: fixed; inset: 0; z-index: 50; pointer-events: none; background: #000; }

        #loading { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; font-size: 20px; color: #aaa; }
        #loading.hide { display: none; }

        #controls-hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 6px; font-size: 12px; color: #999; z-index: 200; white-space: nowrap; display: none; gap: 12px; align-items: center; }
        #controls-hint.show { display: flex; }
        #controls-hint .hide-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 0 2px; }
        #controls-hint .hide-btn:hover { color: #aaa; }

        @media (pointer: coarse) {
            #joystick-area, #action-btn { display: block; }
        }
        @media (pointer: fine) {
            #joystick-area, #action-btn { display: none; }
            #controls-hint.show { display: flex; }
        }

        @media (max-width: 600px) {
            #joystick-area { width: 120px; height: 120px; bottom: max(60px, env(safe-area-inset-bottom)); left: max(40px, env(safe-area-inset-left)); }
            #joystick-knob { width: 50px; height: 50px; top: 35px; left: 35px; }
            #action-btn { width: 80px; height: 80px; bottom: max(60px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-world">
            <div id="map"></div>
            <div id="player"><div class="player-sprite" id="playerSprite"></div></div>
        </div>
        <div id="player-hp-outer"><div id="player-hp-inner"></div></div>
        <div id="level-label">Level 1</div>
        <div id="level-selector"><input type="number" id="level-input" min="1" value="1"><button id="level-go">Go</button></div>
        <div id="interact-prompt">Open</div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <button id="action-btn">BURST</button>
        <div id="loading">Loading level...</div>
        <div id="fog"></div>
        <div id="controls-hint"><span>WASD / Arrows = Move&nbsp;&nbsp;|&nbsp;&nbsp;Z = Burst&nbsp;&nbsp;|&nbsp;&nbsp;Space = Open</span><button class="hide-btn" id="hide-hint">✕</button></div>
    </div>
    <script src="map-walk.js"></script>
</body>
</html>
