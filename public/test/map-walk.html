<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Walk</title>
    <style>
        body { margin: 0; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; min-height: 100vh; min-height: -webkit-fill-available; overflow: hidden; }
        
        /* Mobile viewport height fix */
        @supports (height: 100dvh) {
            #game-container { min-height: 100dvh; }
        }
        #map { position: absolute; width: 5000px; height: 5000px; background: #1a1a1a; border: 20px solid #555; box-sizing: border-box; }
        .wall { position: absolute; background: #444; border: 1px solid #222; box-sizing: border-box; }
        
        #player { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; z-index: 10; pointer-events: none; }
        .player-sprite { width: 100%; height: 100%; background-image: url('/images/assets/roguelike3.png'); background-repeat: no-repeat; background-size: 500% 500%; background-position: 0% 0%; clip-path: inset(21px 30px 17px 30px); }


        /* Joystick */
        #joystick-area { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); left: max(20px, env(safe-area-inset-left)); width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
        #joystick-knob { position: absolute; width: 56px; height: 56px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 37px; left: 37px; }

        /* Action Button */
        #action-btn { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); width: 90px; height: 90px; background: #f33; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 1rem; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        
        @media (max-width: 600px) {
            #joystick-area { width: 100px; height: 100px; bottom: max(15px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left)); }
            #joystick-knob { width: 40px; height: 40px; top: 30px; left: 30px; }
            #action-btn { width: 70px; height: 70px; bottom: max(15px, env(safe-area-inset-bottom)); right: max(10px, env(safe-area-inset-right)); font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="map"></div>
        <div id="player"><div class="player-sprite" id="playerSprite"></div></div>
        <div id="joystick-area"><div id="joystick-knob"></div></div>
        <button id="action-btn">BURST</button>
    </div>
    <script src="map-walk.js"></script>
</body>
</html>
